# /etc/pacman.conf - SigmaOS Arch Linux Installed System Configuration
[options]
HoldPkg     = pacman glibc linux sigmaos-base
Architecture = x86_64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# [sigmaos] repo disabled: repo/os/x86_64 is not published yet (404s and
# breaks `pacman -Sy` for the whole system, including pacstrap installs).
# Re-enable once the SigmaOS package repository is live.
#[sigmaos]
#SigLevel = Optional TrustAll
#Server = https://raw.githubusercontent.com/AaryanSinghChauhan09/SigmaOS/main/repo/os/$arch
#Include = /etc/pacman.d/sigmaos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
